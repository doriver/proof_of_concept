spring:
  application:
    name: springboot-poc
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/spring_poc?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: 'true'
        use_sql_comments: 'false'
        auto_quote_keyword: 'true'
        show_sql: 'true'
        default_batch_fetch_size: 10
    database-platform: org.hibernate.dialect.MySQLDialect
  data:
    redis:
      host: localhost # WSL에 있는 Redis에도 접근 가능( WSL의 localhost 포워딩 기능 덕분에 )
      port: 6379